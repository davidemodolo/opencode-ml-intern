[project]
name = "ml-intern-mcp"
version = "0.1.0"
description = "MCP server with ML research and GPU compute tools for coding agents"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Davide Modolo", email = "davide.modolo98@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
    "huggingface-hub==2.4.0",
    "mcp==2.3.0",
    "nbconvert==7.17.2",
    "nbformat==5.11.1",
    "nvidia-ml-py==13.615.71",
    "requests==2.34.2",
    "thefuzz==0.22.1",
    "whoosh==2.7.4",
]

[project.scripts]
ml-intern-mcp = "ml_intern_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/ml_intern_mcp/tools"]
