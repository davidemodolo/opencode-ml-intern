name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm test

  opencode:
    runs-on: ubuntu-latest
    needs: [server, plugin]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm install -g @opencode/cli@2.3.0
      - run: npm ci && npm run build
        working-directory: plugin
      - name: Plugin loads and registers the agents
        working-directory: e2e
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          opencode debug agents --standalone > agents.json
          node -e '
            const agents = JSON.parse(require("fs").readFileSync("agents.json", "utf8"))
            for (const id of ["ml-intern", "ml-research"]) {
              if (!agents.some((a) => a.id === id)) throw new Error("missing agent " + id)
            }
            console.log("agents ok")
          '
